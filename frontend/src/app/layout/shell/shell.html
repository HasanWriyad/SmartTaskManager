<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/dashboard">
    <mat-icon>task_alt</mat-icon>
    <span class="brand-name">Smart Task Manager</span>
  </a>

  <nav class="nav" aria-label="Main">
    @for (item of navItems(); track item.path) {
      <a mat-button [routerLink]="item.path" routerLinkActive="active" [attr.aria-label]="item.label">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <span class="spacer"></span>

  @if (user(); as current) {
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button" aria-label="Account menu">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ current.fullName }}</span>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="user-summary" role="presentation">
        <strong>{{ current.fullName }}</strong>
        <span>{{ current.email }}</span>
        <span class="role">{{ roleLabel() }}</span>
      </div>
      <mat-divider />
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
